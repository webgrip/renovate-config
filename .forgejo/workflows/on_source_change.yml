name: On Source Change

# Forgejo mirror of the former .github/workflows/on_source_change.yml. Adaptations:
#   - runs-on: docker (the only label the in-cluster runner advertises)
#   - checkout@v5 (v6 is broken on non-GitHub runners)
#   - release calls the .forgejo reusable; GitHub-App auth dropped for the webgrip-ci bot (WEBGRIP_CI_TOKEN — secrets.FORGEJO_TOKEN is the built-in per-job token: Ghost releases, no native release event)
#   - semantic-release publishes via the Gitea plugin (the shared .releaserc.cjs gates on GITEA_ACTIONS)
#   - GITEA_URL comes from the shared composite action (falls back to github.server_url)

on:
  push:
    branches:
      - main
      - next
    paths:
      - .forgejo/workflows/on_source_change.yml
      - '*.json'
      - parts/**
      - scripts/**
      - .releaserc.cjs
      - package.json
      - package-lock.json
      - .nvmrc

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-all:
    name: validate all presets
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate full preset suite
        run: npm run validate

  profiles:
    name: presets are generated and behave
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Presets match their parts and apply the intended policy
        run: npm test

  # Normal job (runs-on: docker) + step-level composite action — NOT a job-level `uses:` reusable.
  # A job-level reusable must omit runs-on, which makes Forgejo v15 flatten its inner jobs into this
  # graph and stop `needs`/`if` from gating reliably; infra uses this normal-job shape for exactly that
  # reason. The composite action is pinned to an ABSOLUTE URL (step-level `uses:` otherwise resolves
  # against data.forgejo.org → 404). It self-checks-out with the bot token and installs the gitea plugin.
  release:
    name: Semantic Release
    needs:
      - validate-all
      - profiles
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    runs-on: docker
    # The v2 composite installs nothing: the release toolchain IS this image
    # (webgrip/workflows ADR-0005; without it the job fails with instructions).
    container:
      image: harbor.webgrip.dev/webgrip/semantic-release:2.3.0@sha256:c9a328024c0070438b0ec08bbd3419896c728ce2c5b1f323fc9dae8bc46a2e71
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - name: Semantic Release
        uses: https://forgejo.webgrip.dev/webgrip/workflows/.forgejo/composite-actions/semantic-release@v3.3.0
        with:
          token: ${{ secrets.WEBGRIP_CI_TOKEN }}
          install-dependencies: "false"
