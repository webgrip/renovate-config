name: Validate Renovate presets

# Forgejo mirror of the former .github/workflows/validate.yml (runs-on: docker, checkout@v5).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-all:
    name: validate all presets
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate full preset suite
        run: npm run validate

  test:
    name: presets are generated and behave
    runs-on: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Presets match their parts and apply the intended policy
        run: npm test
