name: Validate Renovate presets

# Forgejo mirror of the former .github/workflows/validate.yml (runs-on: docker, checkout@v5).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-all:
    name: validate all presets
    runs-on: docker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate full preset suite
        run: npm run validate

  test:
    name: presets are generated and behave
    runs-on: docker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Presets match their parts and apply the intended policy
        run: npm test
